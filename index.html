<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mini Quest Battle</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#000;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;margin:0 auto;background:#202830}
#ui{position:fixed;bottom:10px;left:10px;display:flex;flex-wrap:wrap;width:140px}
.btn{width:60px;height:60px;margin:5px;border-radius:8px;background:#5e5e5e;opacity:.7;display:flex;align-items:center;justify-content:center;font:bold 24px/1 sans-serif;color:#fff}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);color:#fff;font-family:sans-serif;flex-direction:column;text-align:center}
#battleBtns button{margin:8px 16px;padding:8px 20px;border:none;border-radius:5px;background:#3498db;color:#fff;font-size:18px}
#battleInfo{white-space:pre-line;margin-bottom:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="battleInfo"></div>
  <div id="battleBtns">
    <button id="atk">たたかう</button>
    <button id="run">にげる</button>
  </div>
  <button id="next" style="display:none;padding:6px 20px;border:none;background:#fff;color:#000;border-radius:4px">OK</button>
</div>
<div id="ui">
  <div class="btn" id="up">▲</div>
  <div class="btn" id="left">◀</div>
  <div class="btn" id="down">▼</div>
  <div class="btn" id="right">▶</div>
</div>
<script>
(()=>{const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const tile=32;let W=12,H=18;function resize(){cvs.width=W*tile;cvs.height=H*tile;}resize();
// map
const map=[];for(let y=0;y<H;y++){map[y]=[];for(let x=0;x<W;x++){map[y][x]=Math.random()<.1?2:0;}}
const player={x:1,y:1,hp:20,maxHp:20};
function draw(){
 ctx.fillStyle='#202830';ctx.fillRect(0,0,cvs.width,cvs.height);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const t=map[y][x];if(t===0){ctx.fillStyle='#3c8c3c';}
  else if(t===2){ctx.fillStyle='#6d6d6d';}
  ctx.fillRect(x*tile,y*tile,tile,tile);
 }
 ctx.strokeStyle='rgba(0,0,0,.2)';for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*tile,0);ctx.lineTo(x*tile,H*tile);ctx.stroke();}
 for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*tile);ctx.lineTo(W*tile,y*tile);ctx.stroke();}
 ctx.fillStyle='#4287f5';ctx.fillRect(player.x*tile+4,player.y*tile+4,tile-8,tile-8);
}
function loop(){draw();requestAnimationFrame(loop);}loop();
// movement
function move(dx,dy){const nx=player.x+dx,ny=player.y+dy;if(nx<0||ny<0||nx>=W||ny>=H)return;if(map[ny][nx]===2)return;player.x=nx;player.y=ny;
 if(Math.random()<.25)startBattle();}
document.getElementById('up').addEventListener('touchstart',()=>move(0,-1));
document.getElementById('left').addEventListener('touchstart',()=>move(-1,0));
document.getElementById('down').addEventListener('touchstart',()=>move(0,1));
document.getElementById('right').addEventListener('touchstart',()=>move(1,0));
window.addEventListener('keydown',e=>{if(e.key==='ArrowUp')move(0,-1);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);});
// battle
const overlay=document.getElementById('overlay'),info=document.getElementById('battleInfo');
const atkBtn=document.getElementById('atk'),runBtn=document.getElementById('run'),nextBtn=document.getElementById('next');
let enemy=null,phase='command';
function startBattle(){
 const enemies=[{name:'スライム',hp:5,atk:[1,3]},{name:'ドラキー',hp:7,atk:[2,4]},{name:'ゴースト',hp:6,atk:[1,4]}];
 enemy=JSON.parse(JSON.stringify(enemies[Math.floor(Math.random()*enemies.length)]));
 phase='command';updateInfo();
 overlay.style.display='flex';
}
function updateInfo(msg=''){
 const p=`${enemy.name}  HP:${enemy.hp}\nあなた  HP:${player.hp}/${player.maxHp}\n${msg}`;
 info.textContent=p;
}
function attack(){
 const dmg=2+Math.floor(Math.random()*3);enemy.hp-=dmg;
 let text=`あなたのこうげき！\n${enemy.name} に ${dmg} ダメージ！`;
 if(enemy.hp<=0){text+=`\n${enemy.name} を たおした！`;phase='result';showResult(true,text);return;}
 const edmg=enemy.atk[0]+Math.floor(Math.random()*(enemy.atk[1]-enemy.atk[0]+1));player.hp-=edmg;
 text+=`\n${enemy.name} の こうげき！\nあなたは ${edmg} ダメージ！`;
 if(player.hp<=0){text+='\nあなたは たおれてしまった…';phase='result';showResult(false,text);return;}
 updateInfo(text);
}
function tryRun(){
 if(Math.random()<.5){showResult(true,'うまく にげきれた！');}else{ const edmg=1+Math.floor(Math.random()*3);player.hp-=edmg;updateInfo(`にげられない！\n${enemy.name} の こうげき！\nあなたは ${edmg} ダメージ！`);
  if(player.hp<=0){showResult(false,'あなたは たおれてしまった…');}}
}
function showResult(win,msg){atkBtn.style.display='none';runBtn.style.display='none';nextBtn.style.display='block';info.textContent=msg;}
function resetOverlay(){
 overlay.style.display='none';atkBtn.style.display='inline-block';runBtn.style.display='inline-block';nextBtn.style.display='none';
 if(player.hp<=0){player.hp=player.maxHp;player.x=1;player.y=1;}
}
atkBtn.onclick=()=>attack();
runBtn.onclick=()=>tryRun();
nextBtn.onclick=()=>{resetOverlay();};
})();
</script>
</body>
</html>
